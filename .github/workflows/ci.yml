# Build and test on every push. The backend tests need Docker for Testcontainers (PostgreSQL 17);
# GitHub's ubuntu runners provide it. They don't need Keycloak: FakeKeycloak stands in for it.
#
# D-44 (OPS-2, decided by the PM): every job runs on ubuntu-24.04, named, so that nothing changes on its own when
# ubuntu-latest moves to Ubuntu 26.04 (from 2026-10-19, runner-images issue 14748); the actions are at their majors
# that run on Node 24 (checkout v7, setup-java v6, setup-node v7). The same build on ubuntu-26.04, which production
# runs (26.04.1 LTS), is ci-ubuntu-26.yml, started by hand only. deploy.sh's gate counts every check run of the
# commit (deploy/deploy.sh, ci_check), so this file's jobs must stay the same in number and always complete.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # D-99 (decided by the PM): the test classes run in random order, with the run's number as the seed, printed here and
      # by Surefire ("To reproduce ordering use flag -Dsurefire.runOrder.random.seed=<n>"). A failure here is a real
      # fault, an isolation one most likely: fix the isolation, never pin the order. To repeat a run:
      # ./mvnw -B clean verify -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed=<n>
      - name: Build and test
        working-directory: backend
        env:
          SEED: ${{ github.run_number }}
        run: |
          echo "Test classes in random order, seed $SEED"
          ./mvnw -B verify -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed="$SEED"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      # "build" runs tsc first, so this type-checks as well as bundles.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  web-image:
    name: Web image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # F6c's checks (frontend tests, privacy.test.ts) ran only against Vite's dev server. This builds the image
      # deploy/app/docker-compose.yml runs in production (frontend/Dockerfile, target web) and checks it, inside as its
      # own user (nginx, uid 101) and through its own nginx (frontend/web.conf), on a free port, with no other
      # container and no network beyond localhost (.github/scripts/check-web-image.sh).
      # The check's own test, against stubs of docker and curl whose outputs exceed any pipe's buffer: a pipe into a
      # reader that stops early fails every time there, not now and then as in CI #46 (exit 141, F7b).
      - name: Test the check against stubs
        run: .github/scripts/tests/check-web-image-test.sh

      - name: Build the web image and check it
        run: .github/scripts/check-web-image.sh frontend finance-tracker-web:ci

      # F7's deploy shipped privacy.html as -rw------- root, which nginx answered with 403: the server's clone is
      # written under the deploy scripts' umask 077, and the image kept the checkout's modes. This checkout gives 644,
      # so the same build from a copy whose files are 600 and folders 700, with the same checks.
      - name: Build it from a copy with the server's modes and check it
        run: .github/scripts/check-web-image.sh frontend finance-tracker-web:server-modes --server-modes

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-24.04
    steps:
      # The whole history: deploy/tests/run.sh runs 4510003's deploy.sh, taken from it with git show (OPS-2).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scripts that deploy to production (deploy/deploy.sh, deploy/rollback.sh), their tests and stubs.
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x
          deploy/deploy.sh deploy/rollback.sh deploy/common.sh
          deploy/tests/run.sh deploy/tests/mutate.sh deploy/tests/stubs/*
          .github/scripts/check-web-image.sh .github/scripts/tests/check-web-image-test.sh .github/scripts/tests/stubs/*

      # Against stubs of docker, systemctl, pg-restore-test, curl and install, in a temp folder: no container, no network.
      - name: Tests
        run: deploy/tests/run.sh

      - name: Mutations
        run: deploy/tests/mutate.sh

  dependencies:
    name: Dependency updates
    runs-on: ubuntu-24.04
    # Advisory only: newer versions are reported, never enforced, and never fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # processDependencyManagement=false keeps the Boot BOM's hundreds of managed artifacts out of
      # the report, leaving only what this project declares. Pre-release versions are filtered out.
      - name: Check for newer dependency versions
        working-directory: backend
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.18.0:display-dependency-updates \
            -DprocessDependencyManagement=false \
            -Dmaven.version.ignore='.*-M\d+,.*-RC\d+,.*-rc\d+,.*-beta.*,.*-alpha.*' \
            | tee updates.txt

      # Surfaced on the run's summary page, so it is not buried in the log.
      - name: Report
        if: always()
        working-directory: backend
        run: |
          {
            echo '## Maven dependency updates'
            echo
            if grep -q 'newer versions' updates.txt; then
              echo '```'
              sed -n '/newer versions/,/^\[INFO\] *$/p' updates.txt | sed 's/^\[INFO\] \{0,2\}//'
              echo '```'
            else
              echo 'All declared dependencies are up to date.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
