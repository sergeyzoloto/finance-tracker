# Build and test on every push. The backend tests need Docker for Testcontainers (PostgreSQL 17);
# GitHub's ubuntu runners provide it. They don't need Keycloak: FakeKeycloak stands in for it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      # "build" runs tsc first, so this type-checks as well as bundles.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  web-image:
    name: Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # F6c's checks (frontend tests, privacy.test.ts) ran only against Vite's dev server. This builds the image
      # deploy/app/docker-compose.yml runs in production (frontend/Dockerfile, target web) and checks it through its
      # own nginx (frontend/web.conf), on a free port, with no other container and no network beyond localhost.
      - name: Build the web image
        run: docker build --target web -t finance-tracker-web:ci frontend

      - name: Start it and check it through nginx
        run: |
          set -euo pipefail
          docker run -d --rm --name finance-tracker-web-ci -p 127.0.0.1::8080 finance-tracker-web:ci
          trap 'docker logs finance-tracker-web-ci || true; docker stop finance-tracker-web-ci' EXIT
          port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' \
            finance-tracker-web-ci)
          base="http://127.0.0.1:$port"
          for i in $(seq 30); do curl -s -o /dev/null "$base/" && break; sleep 1; done

          check() { # path, expected status, text expected in the body (skipped when empty)
            local path=$1 status=$2 text=${3:-} code
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$base$path")
            [ "$code" = "$status" ] || { echo "❌ $path: expected $status, got $code"; cat /tmp/body; exit 1; }
            if [ -n "$text" ]; then
              grep -qF "$text" /tmp/body || { echo "❌ $path: missing '$text'"; cat /tmp/body; exit 1; }
            fi
            echo "✅ $path: $code"
          }

          check /privacy 200 '<h1>Privacy policy</h1>'
          check /privacy.html 200 '<h1>Privacy policy</h1>'
          check / 200 '<div id="root">'
          check /family/1/report 200 '<div id="root">'
          asset=$(docker exec finance-tracker-web-ci sh -c 'ls /usr/share/nginx/html/assets' | head -n 1)
          [ -n "$asset" ] || { echo "❌ no file under /assets/"; exit 1; }
          curl -sI "$base/assets/$asset" | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable$' \
            || { echo "❌ /assets/$asset: not cached as immutable"; curl -sI "$base/assets/$asset"; exit 1; }
          check "/assets/$asset" 200
          check /assets/missing.js 404
          check /favicon.svg 200
          check /favicon.ico 200

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scripts that deploy to production (deploy/deploy.sh, deploy/rollback.sh), their tests and stubs.
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x
          deploy/deploy.sh deploy/rollback.sh deploy/common.sh
          deploy/tests/run.sh deploy/tests/mutate.sh deploy/tests/stubs/*

      # Against stubs of docker, systemctl, pg-restore-test, curl and install, in a temp folder: no container, no network.
      - name: Tests
        run: deploy/tests/run.sh

      - name: Mutations
        run: deploy/tests/mutate.sh

  dependencies:
    name: Dependency updates
    runs-on: ubuntu-latest
    # Advisory only: newer versions are reported, never enforced, and never fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # processDependencyManagement=false keeps the Boot BOM's hundreds of managed artifacts out of
      # the report, leaving only what this project declares. Pre-release versions are filtered out.
      - name: Check for newer dependency versions
        working-directory: backend
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.18.0:display-dependency-updates \
            -DprocessDependencyManagement=false \
            -Dmaven.version.ignore='.*-M\d+,.*-RC\d+,.*-rc\d+,.*-beta.*,.*-alpha.*' \
            | tee updates.txt

      # Surfaced on the run's summary page, so it is not buried in the log.
      - name: Report
        if: always()
        working-directory: backend
        run: |
          {
            echo '## Maven dependency updates'
            echo
            if grep -q 'newer versions' updates.txt; then
              echo '```'
              sed -n '/newer versions/,/^\[INFO\] *$/p' updates.txt | sed 's/^\[INFO\] \{0,2\}//'
              echo '```'
            else
              echo 'All declared dependencies are up to date.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
