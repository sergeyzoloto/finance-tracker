# Datasource and JWT issuer come from SPRING_* environment variables (see docker-compose.yml).
spring:
  application:
    name: finance-tracker
  datasource:
    hikari:
      # Own schema: Supabase publishes "public" through its Data API.
      schema: app
  flyway:
    schemas: app
  mvc:
    format:
      date: iso
    problemdetails:
      enabled: true
