# The datasource comes from SPRING_* environment variables, login from KEYCLOAK_* (see docker-compose.yml, docs/auth.md).
app:
  keycloak:
    # Realm URL exactly as in the tokens' "iss" claim. Production: https://auth.finance-nl.com/realms/myapps
    issuer-url: ${KEYCLOAK_ISSUER_URL:http://localhost:8080/realms/myapps}
    client-id: ${KEYCLOAK_CLIENT_ID:finance-tracker}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  rates:
    # The ECB's euro reference rates (ledger.rates.EcbRateLoader): loaded at startup and after the ECB publishes.
    ecb:
      enabled: ${ECB_RATES_ENABLED:true}
      daily-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
      history-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
      # Europe/Berlin. The ECB publishes at about 16:00 CET on TARGET working days; 18:30 catches a late one.
      cron: "0 30 16,18 * * MON-FRI"
spring:
  application:
    name: finance-tracker
  datasource:
    hikari:
      # Own schema: Supabase publishes "public" through its Data API.
      schema: app
  flyway:
    schemas: app
  jackson:
    generator:
      # Money goes out as JSON strings (api.ApiJsonConfiguration), and never in exponent notation.
      write-bigdecimal-as-plain: true
  mvc:
    format:
      date: iso
  servlet:
    multipart:
      # POST /api/import: the Excel ledger's CSV exports. nginx allows the same (frontend/nginx.conf).
      max-file-size: 10MB
      max-request-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Discovery and signing keys are fetched on the first token, not at startup; keys are cached and
          # refetched when a token names an unknown key.
          issuer-uri: ${app.keycloak.issuer-url}
          # Members only. Keycloak names this client in "aud" when the user or service holds one of its roles, and in
          # every token this client requests itself (an audience mapper on the client); the "user" role is checked too.
          audiences: ${app.keycloak.client-id}
management:
  endpoints:
    web:
      exposure:
        # Only /actuator/health, open without login (security.SecurityConfig) and saying only UP or DOWN. The container's
        # health check calls it; production's Caddy doesn't route /actuator (deploy/caddy/app.finance-nl.com.caddy).
        include: health
server:
  # Behind nginx or Caddy. A TLS proxy in front of it must send X-Forwarded-Proto: https, so login redirects use https.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
springdoc:
  # Under /api, so that nginx and the Vite dev server pass it on, and only members can read it.
  api-docs:
    path: /api/openapi
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
