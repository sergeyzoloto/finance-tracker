# The one place of the tests' configuration: every Spring context of the tests reads this file (TEST-1a, D-1203).

# The history jobs (ledger.history.HistoryJobs) run from the application, not in tests: a test that wants one calls it.
app.history.jobs.enabled=false
# No downloads from the ECB, and no schedule (ledger.rates.EcbSchedule): EcbRateLoaderTests load from a stand-in they start.
app.rates.ecb.enabled=false
# The same for the Bank of Russia's rate (ledger.rates.CbrSchedule): CbrRateLoaderTests load from a stand-in.
app.rates.cbr.enabled=false

# Quiet logs; the lines a run is measured by (the contexts' "Started ... in ... seconds", Flyway's migrations, the
# containers) stay at INFO.
logging.level.root=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO
logging.level.org.testcontainers=INFO
logging.level.tc=INFO
# "Started X in Y seconds" is logged by the test class's own logger, so the tests' package stays at INFO.
logging.level.com.example.financetracker=INFO
