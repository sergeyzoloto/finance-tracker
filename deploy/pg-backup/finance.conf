# Backup instance "finance": Finance Tracker's database. Installed on the server as /etc/pg-backup/finance.conf
# (deploy/RUNBOOK.md, "Backups"); read by the auth server's pg-backup and pg-restore-test, which run it from the timer
# pg-backup@finance.timer. The format is the auth server's (its deploy/backup/auth.conf): KEY=value, one per line; the
# value is everything after the first "=", taken literally (no quotes, no variables). No secrets belong here.

# Compose project directory and the service that runs Postgres (deploy/app/docker-compose.yml)
COMPOSE_DIR=/opt/finance-tracker/deploy/app
SERVICE=postgres

# Database and login, as postgres-init.sh creates them. pg_dump runs inside the container over the local socket, which
# needs no password; the login owns the database and the schema app, and so everything in them.
DB_NAME=finance
DB_USER=finance

# Dumps go to BACKUP_DIR; the laptop pulls everything under /var/backups/pg/
BACKUP_DIR=/var/backups/pg/finance
RETENTION_DAYS=14

# Restore test (pg-restore-test finance): each CHECK_NAME query runs read-only against production and against the
# restored copy, and the results must match. The number of tables is always compared. Every row of the ledger lives in
# the schema app. A sign-up or an entry between the dump and the test is a mismatch too: back up again and repeat.
# The ECB's rates are left out: the api loads new ones every working day. The ledgers and their members exist since
# V5 (F2a): install this file only once the api that migrates to V5 runs, and back up before the next test.
CHECK_MIGRATION=SELECT max(installed_rank) FROM app.flyway_schema_history WHERE success
CHECK_USERS=SELECT count(*) FROM app.users
CHECK_SETTINGS=SELECT count(*) FROM app.user_settings
CHECK_LEDGERS=SELECT count(*) FROM app.ledger
CHECK_MEMBERS=SELECT count(*) FROM app.ledger_member
CHECK_ACCOUNTS=SELECT count(*) FROM app.account
CHECK_CATEGORIES=SELECT count(*) FROM app.category
CHECK_COUNTERPARTIES=SELECT count(*) FROM app.counterparty
CHECK_ENTRIES=SELECT count(*) FROM app.journal_entry
CHECK_POSTINGS=SELECT count(*) FROM app.posting
CHECK_POSTED_AMOUNTS=SELECT coalesce(sum(abs(amount)), 0) FROM app.posting
CHECK_UNBALANCED=SELECT count(*) FROM (SELECT FROM app.posting GROUP BY entry_id, currency HAVING sum(amount) <> 0) AS unbalanced
CHECK_MANUAL_RATES=SELECT count(*) FROM app.exchange_rate WHERE user_id IS NOT NULL
# The family budget's records, shares, links and journal (V7, F4a): install this file only once the api that migrates
# to V7 runs, and back up before the next test.
CHECK_FAMILY_RECORDS=SELECT count(*) FROM app.family_record
CHECK_FAMILY_SHARES=SELECT count(*) FROM app.family_share
CHECK_FAMILY_LINKS=SELECT count(*) FROM app.family_entry_link
CHECK_FAMILY_JOURNAL=SELECT count(*) FROM app.family_record_change
