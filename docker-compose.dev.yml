# Frontend on the Vite dev server with hot reload, at http://localhost:5173, on top of the local setup:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.dev.yml up --build
# After changing dependencies add -V so node_modules is refreshed from the image.
services:
  frontend:
    image: finance-tracker-frontend:dev # keep the dev image from replacing the nginx one
    build:
      target: dev
    environment:
      API_PROXY_TARGET: http://127.0.0.1:${BACKEND_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
