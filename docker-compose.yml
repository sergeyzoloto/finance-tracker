# Production-like stack: nginx serves the frontend and proxies the API and the login endpoints to the backend.
# Users log in through the shared Keycloak, realm myapps, client finance-tracker (docs/auth.md).
# Locally, docker-compose.local.yml goes on top (COMPOSE_FILE in .env) to reach the auth server's dev stack;
# for frontend hot reload see docker-compose.dev.yml.
# Postgres is hosted on Supabase; the backend connects through the Session Pooler, whose per-user client limit is the
# project's pool size, hence the small connection pool.
services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?set KEYCLOAK_ISSUER_URL in .env}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?set KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
