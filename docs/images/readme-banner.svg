<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <!-- README's banner, drawn for this project: the app's icon (frontend/public/favicon.svg, its path and colours
       unchanged) beside an abstract dashboard. Every other colour is a token of the Blue theme in
       frontend/src/index.css: bg #18212F, surface #1F2A3B, border #33435C, border-control #6B82A8, accent #A99BFF,
       text #E3E9F2, expense #F2A65A, chart-income #4A9BE0, chart-expense #F2A65A. No text, no figures.
       readmeAssets.test.ts checks the colours. -->
  <rect width="1280" height="320" rx="24" fill="#18212F"/>

  <!-- The icon, 32 px scaled 6 times. -->
  <g transform="translate(88 64) scale(6)">
    <rect width="32" height="32" rx="6" fill="#0b5cad"/>
    <path fill="#fff" d="M6 18h4v8H6zM14 12h4v14h-4zM22 6h4v20h-4z"/>
  </g>

  <!-- Card 1: a segmented control, then income and expenses in paired bars with a year earlier's ticks. -->
  <rect x="360" y="40" width="532" height="240" rx="12" fill="#1F2A3B" stroke="#33435C" stroke-width="2"/>
  <g>
    <rect x="384" y="64" width="198" height="26" rx="6" fill="none" stroke="#6B82A8" stroke-width="1.5"/>
    <rect x="385" y="65" width="65" height="24" rx="5" fill="#A99BFF"/>
    <path d="M450 65v24M516 65v24" stroke="#6B82A8" stroke-width="1.5"/>
  </g>
  <path d="M384 114v146" stroke="#33435C" stroke-width="2"/>
  <g>
    <rect x="385" y="118" width="400" height="12" rx="4" fill="#4A9BE0"/>
    <rect x="385" y="132" width="300" height="12" rx="4" fill="#F2A65A"/>
    <rect x="745" y="116" width="2" height="16" fill="#E3E9F2"/>
    <rect x="655" y="130" width="2" height="16" fill="#E3E9F2"/>

    <rect x="385" y="160" width="430" height="12" rx="4" fill="#4A9BE0"/>
    <rect x="385" y="174" width="340" height="12" rx="4" fill="#F2A65A"/>
    <rect x="770" y="158" width="2" height="16" fill="#E3E9F2"/>
    <rect x="690" y="172" width="2" height="16" fill="#E3E9F2"/>

    <rect x="385" y="202" width="380" height="12" rx="4" fill="#4A9BE0"/>
    <rect x="385" y="216" width="270" height="12" rx="4" fill="#F2A65A"/>
    <rect x="735" y="200" width="2" height="16" fill="#E3E9F2"/>
    <rect x="690" y="214" width="2" height="16" fill="#E3E9F2"/>

    <rect x="385" y="244" width="460" height="12" rx="4" fill="#4A9BE0"/>
    <rect x="385" y="258" width="320" height="12" rx="4" fill="#F2A65A"/>
    <rect x="800" y="242" width="2" height="16" fill="#E3E9F2"/>
    <rect x="660" y="256" width="2" height="16" fill="#E3E9F2"/>
  </g>

  <!-- Card 2: daily spending as columns. -->
  <rect x="916" y="40" width="324" height="240" rx="12" fill="#1F2A3B" stroke="#33435C" stroke-width="2"/>
  <path d="M940 248h276" stroke="#33435C" stroke-width="2"/>
  <g fill="#F2A65A">
    <rect x="944" y="196" width="14" height="52" rx="3"/>
    <rect x="966" y="160" width="14" height="88" rx="3"/>
    <rect x="988" y="214" width="14" height="34" rx="3"/>
    <rect x="1010" y="120" width="14" height="128" rx="3"/>
    <rect x="1032" y="184" width="14" height="64" rx="3"/>
    <rect x="1054" y="226" width="14" height="22" rx="3"/>
    <rect x="1076" y="70" width="14" height="178" rx="3"/>
    <rect x="1098" y="174" width="14" height="74" rx="3"/>
    <rect x="1120" y="204" width="14" height="44" rx="3"/>
    <rect x="1142" y="140" width="14" height="108" rx="3"/>
    <rect x="1164" y="218" width="14" height="30" rx="3"/>
    <rect x="1186" y="166" width="14" height="82" rx="3"/>
  </g>
</svg>
