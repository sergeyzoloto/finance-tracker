# A template: when the container starts, the nginx image fills in ${NGINX_PORT} and ${BACKEND_URL} from the
# environment (defaults in the Dockerfile, local values in docker-compose.local.yml).
server {
    listen ${NGINX_PORT};
    root /usr/share/nginx/html;

    # Resolve "backend" per request through Docker's DNS: a recreated backend container gets a new IP,
    # and a stopped one should fail fast instead of hanging on its old address.
    resolver 127.0.0.11 valid=10s;
    set $backend ${BACKEND_URL};

    # The API, and the backend's login (start and Keycloak's callback) and logout.
    location ~ ^/(api|oauth2|login/oauth2|logout)(/|$) {
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        # With the port: the backend builds its login redirect URIs for the address the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed on only when a TLS proxy in front sets it (production: https); without it the backend keeps http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
