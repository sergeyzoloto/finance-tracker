# The container finance-tracker-web in production (deploy/app/docker-compose.yml): the built frontend, behind the auth
# server's Caddy, which sends the backend's paths to finance-tracker-api and every other request here
# (deploy/finance.caddy). Caddy sets the security headers and compresses; this file says how long browsers keep a file.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # nginx sees Caddy's plain HTTP on port 8080, not the address the browser used, so a redirect of its own (such as
    # a directory without its slash) keeps the browser's host and scheme.
    absolute_redirect off;

    # Vite puts a hash of the content into every file name here, so a file never changes: kept for a year. A file
    # that doesn't exist is a 404, never index.html, which a browser would try to run as a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app, or a file next to index.html. Browsers check it on every
    # load (no-cache: they revalidate, and get 304 while it is unchanged), so an update shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
